<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Young Learners English Placement</title>
<style>
:root{color-scheme:light;--ink:#202543;--muted:#505776;--violet:#4d35ac;--line:#dedbf3;--paper:#fff;--soft:#f2efff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#e3f8ee,transparent 55%),#f5f2fe;color:var(--ink);font:1rem/1.55 'Trebuchet MS',system-ui,sans-serif;min-height:100vh}
main{width:min(790px,calc(100% - 32px));margin:clamp(20px,6vw,70px) auto}header{font-weight:800;color:var(--violet);margin-bottom:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,46px);box-shadow:0 17px 55px #39287b15}h1,h2,h3{line-height:1.18;margin:0 0 14px}h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.045em}h2{font-size:clamp(1.35rem,4vw,2rem)}p{margin:0 0 16px}.muted,small{color:var(--muted)}button,input,select{font:inherit}input[type=text],select{border:1px solid #aaa2c9;border-radius:10px;padding:10px 12px;max-width:100%;color:var(--ink);background:white}input[type=text]{display:block;margin:6px 0 18px;width:min(100%,360px)}button{cursor:pointer;border:1px solid transparent;border-radius:12px;padding:10px 17px;background:var(--violet);color:white;font-weight:bold;min-height:46px}button.secondary{background:var(--soft);color:var(--violet)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #138265;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;color:var(--violet)}progress{width:100%;height:9px;margin:10px 0 24px;accent-color:var(--violet)}.passage{padding:16px;background:#eef9f3;border-radius:12px;margin:14px 0 20px;white-space:pre-line}.choice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;cursor:pointer}.choice:has(input:checked){background:var(--soft);border-color:var(--violet)}input[type=radio]{accent-color:var(--violet);width:18px;height:18px;flex:none}audio{display:block;width:min(100%,420px);margin:12px 0 18px}details{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}summary{cursor:pointer;font-weight:bold}table{width:100%;border-collapse:collapse;margin:14px 0}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.table-scroll{overflow:auto}.review li{margin:10px 0}.error{color:#a3263e;font-weight:bold;margin-top:12px}.tag{color:var(--violet);font-weight:bold}.rubric label{display:block;margin:10px 0}.rubric select{display:block}.objects{font-size:2rem;letter-spacing:.22em}@media print{body{background:white}main{width:100%;margin:0}.card{box-shadow:none;border:none;padding:0}button, audio{display:none}details{break-inside:avoid}}

.scene{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:8px;margin:12px 0 0;border:1px solid #a8cfb8;border-radius:16px;background:linear-gradient(#d9f2ff 45%,#c8e8c4 45%);}
.scene .choice{flex-direction:column;justify-content:center;gap:5px;padding:8px 3px;text-align:center;background:#ffffffdb;margin:0;color:var(--ink)}
.scene .choice:has(input:checked){background:#e9e1ff;outline:2px solid var(--violet);outline-offset:-2px}
.figure{font-size:clamp(1.2rem,6vw,2.4rem);line-height:1.3;display:block;white-space:nowrap}
.bag{display:inline-block;position:relative;width:.82em;height:.86em;border:1px solid #32405c;border-radius:35% 35% 20% 20%;vertical-align:-.04em}.bag::after{content:"";position:absolute;inset:48% 13% 12%;border:1px solid #32405c;border-radius:20%;background:#ffffff42}.red-bag{background:#ef5555}.blue-bag{background:#72b8ff}.yellow-bag{background:#f7d657}
.story-pictures{margin:16px 0;break-inside:avoid}
.story-pictures img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px}
.story-pictures figcaption{display:grid;grid-template-columns:repeat(3,1fr);gap:0;text-align:center;font-weight:bold;margin-top:5px}
textarea{display:block;box-sizing:border-box;width:100%;min-height:150px;resize:vertical;border:1px solid #aaa2c9;border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
.story-response{white-space:pre-wrap;overflow-wrap:anywhere}.sequence-step{display:block;margin:12px 0}.sequence-step select{display:block;width:100%}
@media print{.story-pictures,.scene{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><main><header>Young Learners English</header><section id="app" class="card"></section></main>
<script>
const bank = [{"level": "Pre A1 Starters", "listen": [["Which animal does Ben have?", "My name is Ben. My sister has a cat, but I have a small dog.", "\ud83d\udc36 Dog|\ud83d\udc31 Cat|\ud83d\udc30 Rabbit", 0], ["Which bag is Mia\u2019s?", "Is that your red bag, Mia? No, my bag is blue.", "\ud83d\udfe8 Yellow|\ud83d\udfe6 Blue|\ud83d\udfe5 Red", 1], ["How many apples are on the table?", "There are three apples on the table. There are two bananas next to them.", "2|4|3", 2], ["Where is the ball?", "I can see your ball. Look! It\u2019s under the chair.", "Under the chair|On the chair|Next to the chair", 0]], "read": "This is Tom. He is eight. He lives with his mum, his dad and his sister, Lucy. On Saturdays, Tom and Lucy play football in the park. Tom has a green bike, but Lucy walks to the park.", "questions": [["Who is Lucy?", "Tom\u2019s friend|Tom\u2019s sister|Tom\u2019s mum", 1], ["Where do they play football?", "At school|In the garden|In the park", 2], ["How does Lucy get to the park?", "She walks.|She rides a bike.|She takes a bus.", 0], ["Look and choose the word. \ud83d\udc1f", "bird|fish|frog", 1], ["Look and write one word. \ud83d\udc31", null, "cat"], ["Complete with one word. I have two feet and two arms. I can clap my ____.", null, "hands"]], "speak": ["Look at these objects. Point to the apple. What colour is the ball?", "What do you play with your friends?"]}, {"level": "A1 Movers", "listen": [["Where are they going first?", "Let\u2019s go to the library after lunch. Good idea, but I need to buy a pencil first. Okay, let\u2019s go to the shop now.", "To the library|To the shop|To the caf\u00e9", 1], ["What did Jack do yesterday?", "Did you swim yesterday, Jack? No. It was cold, so I went skating with my cousin. We\u2019ll go swimming tomorrow.", "He went skating.|He went swimming.|He played football.", 0], ["What time will they meet?", "Shall we meet at two? I have a music lesson until half past two. Let\u2019s meet at three. Okay, see you then.", "2:00|2:30|3:00", 2], ["Why is Emma taking a jacket?", "Are you cold, Emma? No, I\u2019m fine now. But it\u2019s going to get windy when we\u2019re at the beach. That\u2019s why I\u2019m taking my jacket.", "It\u2019s cold now.|It will be windy later.|She wants to go swimming.", 1]], "read": "Last Sunday, Amina and her brother took the bus to the zoo. They wanted to see the monkeys, but the monkey house was closed in the morning. A keeper told them it would open after lunch. They watched the penguins first and ate sandwiches under a tree. When they came back, one of the monkeys was playing with a yellow ball. Amina took a photo to show her cousin.", "questions": [["Which title fits the story best?", "A Morning at School|A Lost Yellow Ball|A Day at the Zoo", 2], ["Who told them when the monkey house would open?", "A keeper|A bus driver|Amina\u2019s cousin", 0], ["What did they do before lunch?", "They played with a ball.|They watched the penguins.|They visited the monkeys.", 1], ["Why did Amina take a photo?", "To show it to her cousin|To sell it to a keeper|To use it on the bus", 0], ["Complete with one word. Yesterday I ____ to the zoo with my brother. (go)", null, "went"], ["Complete with one word. A giraffe\u2019s neck is longer ____ a zebra\u2019s neck.", null, "than"]], "speak": ["Tell the story from these three clues. A boy leaves home with a kite. The kite gets stuck in a tree. A woman helps him get it back.", "What did you do last weekend? Ask me a question about my weekend."]}, {"level": "A2 Flyers", "listen": [["Why was the trip moved to Friday?", "Our class trip was going to be on Thursday. The science centre is open then, but the bus company can\u2019t take us that day. We\u2019ve moved the trip to Friday.", "The centre was closed.|The class had a test.|The bus wasn\u2019t available.", 2], ["What should the children bring?", "There will be pencils and paper at the workshop. We\u2019ll give you water, too. Please bring an old shirt to wear over your clothes while you paint.", "An old shirt|Some water|Some paper", 0], ["How did Sam feel at the end?", "I thought the climbing wall looked frightening at first. My friend said I could stop whenever I wanted. I kept going and reached the top. I didn\u2019t think I could do it, so I felt really proud.", "Worried|Proud|Bored", 1], ["Where will the group meet if it rains?", "If the weather is good, meet by the school gate. If it starts to rain, go straight to the sports hall. We won\u2019t wait in the library because another group is using it.", "At the school gate|In the library|In the sports hall", 2]], "read": "When Nia\u2019s class decided to grow vegetables, they asked the head teacher for a place to plant them. The only space available was behind the library, where there was very little sun. At first the plants hardly grew. Nia suggested putting the plants into large pots so the class could move them when necessary. The pupils carried the pots to a brighter corner of the playground. After a few weeks, the plants looked much healthier. The class gave some of their first tomatoes to the kitchen and used the rest to make a salad. Next term, they hope to help another class start a garden of its own.", "questions": [["What problem did the class solve?", "The kitchen needed more space.|The plants needed more sunlight.|The pupils had too many tomatoes.", 1], ["Why did Nia suggest using pots?", "The plants would be easier to move.|The playground needed more colour.|The vegetables would be easier to wash.", 0], ["What happened to the first tomatoes?", "They sold all of them.|They gave them all to the kitchen.|They shared some and made a salad.", 2], ["What does the class hope to do next term?", "Grow food behind the library again|Help another class start a garden|Give all their vegetables away", 1], ["Complete with one word. If it rains tomorrow, we ____ move the pots inside. Use the full future form.", null, "will"], ["Complete with one word. The pupils ____ already moved the pots, so you can water them now. Use the present perfect.", null, "have"]], "speak": ["Tell a short story using these clues. Two friends are cycling to a picnic. One bike gets a flat tyre. They find another way to get there. Say how they felt.", "Would you prefer to travel by bike or by bus for a school trip? Give a reason and ask me what I prefer."]}];

const dialogueTurns = {"Is that your red bag, Mia? No, my bag is blue.": ["Is that your red bag, Mia?", "No, my bag is blue."], "Let’s go to the library after lunch. Good idea, but I need to buy a pencil first. Okay, let’s go to the shop now.": ["Let’s go to the library after lunch.", "Good idea, but I need to buy a pencil first.", "Okay, let’s go to the shop now."], "Did you swim yesterday, Jack? No. It was cold, so I went skating with my cousin. We’ll go swimming tomorrow.": ["Did you swim yesterday, Jack?", "No. It was cold, so I went skating with my cousin. We’ll go swimming tomorrow."], "Shall we meet at two? I have a music lesson until half past two. Let’s meet at three. Okay, see you then.": ["Shall we meet at two?", "I have a music lesson until half past two.", "Let’s meet at three.", "Okay, see you then."], "Are you cold, Emma? No, I’m fine now. But it’s going to get windy when we’re at the beach. That’s why I’m taking my jacket.": ["Are you cold, Emma?", "No, I’m fine now. But it’s going to get windy when we’re at the beach. That’s why I’m taking my jacket."]};
const synth = window.speechSynthesis;
const soundCheck = 'Hello! If you can hear me, you are ready to start.';
let stopListening = () => {};

function preferredVoices(voices) {
  return voices.filter(voice => /^en(?:[-_]|$)/i.test(voice.lang) &&
    (/natural|neural|enhanced|premium|online/i.test(voice.name) ||
       (!voice.localService && /^(Google|Microsoft) /i.test(voice.name))))
    .sort((a, b) => voiceRank(b) - voiceRank(a));
}

function voiceRank(voice) {
  return (/natural|neural/i.test(voice.name) ? 4 : 0) +
    (/^en[-_]us$/i.test(voice.lang) ? 2 : 0) +
    (voice.localService ? 1 : 0);
}

function listenMarkup(src) {
  return `<div class="listening-player">
    <div class="actions"><button type="button" class="secondary" data-listen>Play audio</button></div>
    <p class="muted" data-audio-status role="status"></p>
    <details><summary>Offline audio</summary>
      <audio aria-label="Offline listening clip" controls preload="none" src="${src}"></audio>
    </details></div>`;
}

function wireListening(script, band = 0) {
  const button = app.querySelector('[data-listen]');
  const status = app.querySelector('[data-audio-status]');
  const offline = app.querySelector('.listening-player audio');
  let playbackId = 0;
  let active = false;
  let timer;
  function stop() {
    playbackId++;
    active = false;
    clearTimeout(timer);
    synth?.cancel();
    offline.pause();
    button.textContent = 'Play audio';
  }
  function useOffline() {
    stop();
    offline.closest('details').open = true;
    offline.currentTime = 0;
    status.textContent = 'Playing the embedded offline recording.';
    offline.play().catch(() => {
      status.textContent = 'Press play on the offline audio player.';
    });
  }
  stopListening = stop;
  offline.addEventListener('play', () => {
    if (!active) return;
    playbackId++;
    active = false;
    clearTimeout(timer);
    synth?.cancel();
    button.textContent = 'Play audio';
    status.textContent = 'Playing the embedded offline recording.';
  });
  button.onclick = () => {
    if (active || !offline.paused) {
      stop();
      status.textContent = '';
      return;
    }
    const voices = preferredVoices(synth?.getVoices() ?? []);
    if (!voices.length) return useOffline();
    const lines = dialogueTurns[script] ?? [script];
    const second = voices.find(voice => voice.lang === voices[0].lang && voice.name !== voices[0].name) ??
      voices.find(voice => voice.name !== voices[0].name) ?? voices[0];
    const id = ++playbackId;
    active = true;
    button.textContent = 'Stop audio';
    status.textContent = 'Playing with your browser’s enhanced English voice.';
    function speak(i) {
      if (id !== playbackId) return;
      const utterance = new SpeechSynthesisUtterance(lines[i]);
      utterance.voice = i % 2 ? second : voices[0];
      utterance.lang = utterance.voice.lang;
      utterance.rate = [0.88, 0.94, 0.98][band];
      timer = setTimeout(() => { if (id === playbackId) useOffline(); }, 8000);
      utterance.onstart = () => {
        if (id === playbackId) {
          clearTimeout(timer);
          timer = setTimeout(() => { if (id === playbackId) useOffline(); }, 45000);
        }
      };
      utterance.onerror = () => { if (id === playbackId) useOffline(); };
      utterance.onend = () => {
        if (id !== playbackId) return;
        clearTimeout(timer);
        if (i + 1 < lines.length) {
          timer = setTimeout(() => speak(i + 1), 320);
        } else {
          active = false;
          button.textContent = 'Play audio';
          status.textContent = '';
        }
      };
      try { synth.speak(utterance); }
      catch { useOffline(); }
    }
    speak(0);
  };
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function show(html) {
  stopListening();
  stopListening = () => {};
  app.innerHTML = html;
  const title = app.querySelector('h1,h2');
  title.tabIndex = -1;
  title.focus();
}
function welcome() {
  show(`<h1>English placement test</h1><p class="tag">Pre A1 Starters · A1 Movers · A2 Flyers</p>
    <p>Listen, read and write. The questions get harder as you go.</p>
    <p class="muted">${items.length} scored questions · Optional story · Allow about 35–45 minutes · Headphones recommended</p>
    <label for="learner">First name or class code (optional)</label><input id="learner" type="text" autocomplete="off" maxlength="40">
    <details><summary>Check your sound</summary>${listenMarkup(audioFiles.sample)}</details>
    <div class="actions"><button id="start">Start test</button></div>
    <details><summary>Teacher instructions</summary><p>Try the sound check on each device. Play audio uses an enhanced English voice when the browser offers one. Online voices may need internet access. The embedded offline recordings are available on every listening question. Ask learners to play each clip up to twice. Allow about five additional minutes for the optional Flyers story. It has a teacher rubric and does not change automatic placement. Learners can skip questions and return before submitting. The listening scripts below are for teacher read-aloud if playback fails. Allow about five extra minutes for speaking and review the report before assigning a group.</p><p>This is an independent classroom screening tool. The score thresholds are provisional and have not been calibrated against Cambridge exam results. Responses stay on this page until it is closed or refreshed.</p>
    <ol>${items.filter(item => item.script).map(item => `<li>${item.script}</li>`).join('')}</ol><p><a href="https://www.cambridgeenglish.org/exams-and-tests/qualifications/young-learners/" target="_blank" rel="noopener">Cambridge English Young Learners qualifications</a></p></details>`);
  wireListening(soundCheck);
  document.querySelector('#start').onclick = () => {
    learner = document.querySelector('#learner').value.trim();
    question();
  };
}
function choiceMarkup(item, choices) {
  const labels = answerOrders[index].map(i => {
    const choice = choices[i];
    const person = item.scene ? park[i] : null;
    const visual = person ? `<span class="figure" aria-hidden="true">${person.child}</span>
      <span class="figure" aria-hidden="true"><span class="bag ${person.bag}-bag"></span> ${person.pet}</span>` : '';
    return `<label class="choice">${visual}<span><input type="radio" name="answer" value="${i}" ${person ? `aria-label="${person.description}"` : ''} ${answers[index] === String(i) ? 'checked' : ''}>${choice}</span></label>`;
  }).join('');
  return item.scene ? `<div class="scene" role="group" aria-label="Children in the park">${labels}</div>` : labels;
}
function sequenceMarkup(item) {
  const selected = answers[index].split(',');
  return ['First','Next','Last'].map((place, i) =>
    `<label class="sequence-step" for="step${i}">${place}<select id="step${i}" name="step">
    <option value="">Choose an event</option>
    ${answerOrders[index].map(j => `<option value="${j}" ${selected[i] === String(j) ? 'selected' : ''}>${item.sequence[j]}</option>`).join('')}
    </select></label>`).join('');
}
function question() {
  const item = items[index];
  const choices = item.options?.split('|');
  show(`<div class="meta"><span>${item.skill}</span><span>Question ${index + 1} of ${items.length}</span></div>
    <progress aria-label="Test progress" value="${index+1}" max="${items.length}"></progress>
    <h2 id="prompt">${item.prompt}</h2>
    ${item.audio ? `<p class="muted">Press play. You can listen twice.</p>${listenMarkup(item.audio)}` : ''}
    ${item.passage ? `<div class="passage">${item.passage}</div>` : ''}
    <form id="response" aria-labelledby="prompt">
      ${item.sequence ? sequenceMarkup(item) : choices ? choiceMarkup(item, choices) :
        `<label for="answer">Your answer</label><input id="answer" name="answer" type="text" spellcheck="false" autocomplete="off" maxlength="60" value="${escapeHtml(answers[index])}">`}
      ${item.sequence ? '<p id="sequenceError" class="error" role="status"></p>' : ''}
      <div class="actions"><button type="button" id="back" class="secondary" ${index ? '' : 'disabled'}>Back</button><button type="submit">${index === items.length-1 ? 'Continue to story' : 'Next'}</button></div>
    </form>`);
  if (item.audio) wireListening(item.script, item.band);
  const form = document.querySelector('#response');
  form.oninput = () => {
    const data = new FormData(form);
    answers[index] = item.sequence ? data.getAll('step').join(',') : data.get('answer')?.trim() ?? '';
    if (item.sequence) document.querySelector('#sequenceError').textContent = '';
  };
  document.querySelector('#back').onclick = () => { index--; question(); };
  form.onsubmit = event => {
    event.preventDefault();
    if (item.sequence) {
      const steps = answers[index].split(',');
      if (steps.some(Boolean) && (steps.some(step => !step) || new Set(steps).size !== 3)) {
        document.querySelector('#sequenceError').textContent = 'Choose a different event for each step, or clear all three to skip.';
        return;
      }
    }
    if (index === items.length - 1) return writingTask();
    index++;
    question();
  };
}
function storyPictures() {
  return `<figure class="story-pictures">
    <img src="${storyArt}" alt="Picture 1. Two friends walk through a park in sunshine with a bicycle and a picnic basket. Picture 2. It starts raining and the friends look up in surprise. Picture 3. The friends sit on a bench under an umbrella with the picnic basket open between them.">
    <figcaption aria-hidden="true"><span>1</span><span>2</span><span>3</span></figcaption>
  </figure>`;
}
function writingTask() {
  show(`<p class="tag">Optional Flyers writing</p><h2>Write a story</h2>
    <p>Look at the three pictures. Write a story of 20 words or more. Say what happens in each picture.</p>
    ${storyPictures()}
    <label for="story">Your story</label><textarea id="story" spellcheck="false" maxlength="2000">${escapeHtml(story)}</textarea>
    <div class="actions"><button id="writingBack" class="secondary">Back</button><button id="writingNext">Review test</button></div>`);
  document.querySelector('#story').oninput = event => { story = event.target.value; };
  document.querySelector('#writingBack').onclick = question;
  document.querySelector('#writingNext').onclick = confirmation;
}
function confirmation() {
  const missing = answers.map((value, i) => !value || (items[i].sequence && value.split(',').some(step => !step)) ? i : -1).filter(i => i >= 0);
  show(`<h2>Ready to finish?</h2><p>You answered ${items.length - missing.length} of ${items.length} questions.</p>
    ${missing.length ? '<p>Unanswered questions count as zero.</p><div class="actions">'+missing.map(i => `<button class="secondary" data-jump="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')+'</div>' : ''}
    <p>${story.trim() ? 'Your story will be included for your teacher.' : 'You can submit without a story.'}</p>
    <div class="actions"><button id="edit" class="secondary">Back to story</button><button id="finish">Submit test</button></div>`);
  app.querySelectorAll('[data-jump]').forEach(button => button.onclick = () => { index = Number(button.dataset.jump); question(); });
  document.querySelector('#edit').onclick = writingTask;
  document.querySelector('#finish').onclick = report;
}
function correct(item, answer) {
  if (item.options || item.sequence) return String(item.key) === answer;
  const normalized = answer.trim().toLowerCase().replace(/[.!?]+$/, '').trim().replace(/\s+/g, ' ');
  return (item.accepted ?? [item.key]).includes(normalized);
}
function score(graded) {
  const rows = bank.map((_, band) => {
    const marks = graded.filter(mark => mark.band === band);
    const listening = marks.filter(mark => mark.skill === 'Listening' && mark.right).length;
    const literacy = marks.filter(mark => mark.skill !== 'Listening' && mark.right).length;
    const listeningMax = marks.filter(mark => mark.skill === 'Listening').length;
    const literacyMax = marks.length - listeningMax;
    const total = listening + literacy;
    const meets = listening >= Math.ceil(0.75 * listeningMax) &&
      literacy >= Math.ceil(2 * literacyMax / 3) && total >= Math.ceil(0.8 * marks.length);
    return {listening, literacy, total, listeningMax, literacyMax, max:marks.length, meets};
  });
  let band = -1;
  for (const row of rows) { if (!row.meets) break; band++; }
  return { rows, band };
}
function report() {
  const graded = items.map((item, i) => ({...item, right: correct(item, answers[i])}));
  const {rows, band} = score(graded);
  const suggested = bank[band]?.level ?? 'Pre A1 Starters foundations';
  const checkBand = Math.min(Math.max(band, 0), 2);
  const mixed = rows.slice(band+2).some(row => row.meets);
  show(`<p class="tag">Placement report</p><h2>${suggested}</h2>
    ${learner ? `<p>Learner: ${escapeHtml(learner)}</p>` : ''}
    <p>${band < 0 ? 'Start with Starters foundations and check basic vocabulary and listening in person.' : 'Suggested group based on listening, reading and short written answers. Use the optional speaking and writing checks when you need more evidence.'}</p>
    ${mixed ? '<p class="error">The learner met a higher band’s threshold after missing a lower band’s threshold. Review the answers and check both bands orally.</p>' : ''}
    <div class="table-scroll"><table><thead><tr><th scope="col">Level</th><th scope="col">Listening</th><th scope="col">Reading &amp; writing</th><th scope="col">Total</th></tr></thead>
    <tbody>${rows.map((row,i) => `<tr><th scope="row">${bank[i].level}</th><td>${row.listening}/${row.listeningMax}</td><td>${row.literacy}/${row.literacyMax}</td><td>${row.total}/${row.max}</td></tr>`).join('')}</tbody></table></div>
    <small>The suggested group is the highest consecutive band, starting at Starters, that meets all three thresholds. Starters requires 8/10 overall, 3/4 listening and 4/6 reading and writing. Movers and Flyers each require 11/13 overall, 3/4 listening and 6/9 reading and writing. These thresholds are provisional.</small>
    <details open><summary>Teacher-led speaking check</summary>
      <p>Try the suggested band first. Use a neighboring band if the learner needs more support or answers easily.</p>
      <label for="speakingBand">Speaking level</label>
      <select id="speakingBand">${bank.map((entry,i) => `<option value="${i}" ${i === checkBand ? 'selected' : ''}>${entry.level}</option>`).join('')}</select>
      <div id="speakingPrompts" class="passage"></div>
      <div class="rubric">${['Understands the prompts','Responds clearly','Uses vocabulary and sentences appropriate to the level'].map((label,i) => `<label for="rate${i}">${label}<select id="rate${i}" class="rating"><option value="">Choose a rating</option><option value="0">0 · Not yet</option><option value="1">1 · With support</option><option value="2">2 · Independently</option></select></label>`).join('')}</div>
      <p id="speakingScore" aria-live="polite"></p>
      <label for="finalPlacement">Teacher’s final group</label>
      <select id="finalPlacement"><option>Decision pending</option><option>Pre A1 Starters foundations</option>${bank.map(entry => `<option>${entry.level}</option>`).join('')}</select>
    </details>
    <details ${story.trim() ? 'open' : ''}><summary>Flyers story · teacher review</summary>
      ${story.trim() ? `${storyPictures()}<p class="passage story-response">${escapeHtml(story.trim())}</p>
      <p>Rate each criterion from 0 to 2. Use 0 for missing or unclear, 1 for partly achieved and 2 for achieved.</p>
      <div class="rubric">${['Covers the three pictures','Connects events in a clear order','Uses understandable sentences and vocabulary'].map((label,i) =>
        `<label for="storyRate${i}">${label}<select id="storyRate${i}" class="story-rating"><option value="">Choose a rating</option><option>0</option><option>1</option><option>2</option></select></label>`).join('')}</div>
      <p id="storyScore" aria-live="polite">Complete the rubric to see the story score.</p>` : '<p>No story submitted.</p>'}
    </details>
    <details><summary>Review answers</summary><ol class="review">${graded.map((item,i) => {
      const choices = item.options?.split('|');
      const ordered = value => value.split(',').filter(step => step !== '').map(step => item.sequence[Number(step)]).join(' → ');
      const expected = item.sequence ? ordered(item.key) : choices ? choices[item.key] : item.key;
      const given = !answers[i] ? 'Skipped' : item.sequence ? ordered(answers[i]) || 'Skipped' : choices ? choices[Number(answers[i])] : answers[i];
      return `<li><strong>${item.prompt}</strong><br>${item.right ? 'Correct' : 'Expected: ' + escapeHtml(expected)} · Learner: ${escapeHtml(given)}${item.script ? '<br><small>Audio: '+item.script+'</small>' : ''}</li>`;
    }).join('')}</ol></details>
    <div class="actions"><button id="print">Print report / Save as PDF</button><button id="reset" class="secondary">New learner</button></div>`);
  const bandSelect = document.querySelector('#speakingBand');
  const ratings = [...app.querySelectorAll('.rating')];
  function rate() {
    const values = ratings.map(select => select.value);
    const sum = values.reduce((total,value) => total + Number(value),0);
    document.querySelector('#speakingScore').textContent = values.includes('') ? 'Rate all three criteria to see the speaking score.' :
      `Speaking score: ${sum}/6. ${sum >= 5 && !values.includes('0') ? 'The speaking check supports this band.' : 'Review this band with a second prompt or try the band below.'}`;
  }
  function prompts() {
    const i = Number(bandSelect.value);
    document.querySelector('#speakingPrompts').innerHTML = (i === 0 ? '<div class="objects" aria-label="Green apple, red ball, blue book">🍏 🔴 📘</div>' : '') + bank[i].speak.map(text => '<div>'+text+'</div>').join('');
  }
  bandSelect.onchange = () => { ratings.forEach(select => select.value = ''); prompts(); rate(); };
  ratings.forEach(select => select.onchange = rate);
  prompts();
  rate();
  const storyRatings = [...app.querySelectorAll('.story-rating')];
  storyRatings.forEach(select => select.onchange = () => {
    const values = storyRatings.map(rating => rating.value);
    document.querySelector('#storyScore').textContent = values.includes('') ? 'Complete the rubric to see the story score.' :
      `Teacher’s story score: ${values.reduce((sum, value) => sum + Number(value), 0)}/6.`;
  });
  document.querySelector('#print').onclick = () => window.print();
  document.querySelector('#reset').onclick = () => {
    if (!window.confirm('Clear this report and start a new test?')) return;
    answers.fill('');
    answerOrders = shuffleAnswerChoices();
    story = '';
    index = 0;
    learner = '';
    welcome();
  };
}
welcome();
</script></body></html>
